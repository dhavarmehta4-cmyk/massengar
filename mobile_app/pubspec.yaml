name: massengar
description: Massengar - End-to-End Encrypted Real-Time Chat

publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Networking
  socket_io_client: ^2.0.3+1
  dio: ^5.4.3+1
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Local Storage & Security
  sqflite: ^2.3.3
  sqflite_sqlcipher: ^2.2.1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0
  
  # Encryption (Signal Protocol)
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.4
  pointycastle: ^3.9.1
  convert: ^3.1.1
  
  # WebRTC
  flutter_webrtc: ^0.10.6
  
  # UI
  cached_network_image: ^3.3.1
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  video_player: ^2.8.6
  chewie: ^1.7.5
  photo_view: ^0.14.0
  emoji_picker_flutter: ^2.2.0
  
  # Audio
  record: ^5.1.1
  audioplayers: ^6.0.0
  
  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  image: ^4.1.7
  
  # DI
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
